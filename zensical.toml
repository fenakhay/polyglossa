[project]
site_name = "polyglossa"
site_url = "https://docs.fenakhay.com/polyglossa/"
site_description = "English Wiktionary's languages, language families and scripts, for Kotlin, Swift, Python and SQL."
site_author = "fenakhay"
copyright = "Copyright &copy; 2026 fenakhay. Code under the MIT licence; data under CC BY-SA 4.0."
repo_url = "https://github.com/fenakhay/polyglossa"
repo_name = "fenakhay/polyglossa"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Quick start" = "getting-started/quick-start.md" },
    { "Installing" = "getting-started/installing.md" },
  ] },
  { "Guides" = [
    { "Languages" = "guides/languages.md" },
    { "Families" = "guides/families.md" },
    { "Scripts" = "guides/scripts.md" },
    { "Detecting scripts" = "guides/detecting-scripts.md" },
    { "Catalogs" = "guides/catalogs.md" },
    { "SQL" = "guides/sql.md" },
  ] },
  { "Reference" = [
    { "API reference" = "api/" },
    { "Swift and Python" = "reference/swift-and-python.md" },
    { "The data and releases" = "reference/data-and-releases.md" },
    { "Changelog" = "reference/changelog.md" },
  ] },
  { "Contributing" = [
    { "Building" = "contributing/building.md" },
  ] },
]

[project.theme]
language = "en"
logo = "brand/logo-icon.svg"
favicon = "brand/logo-icon.svg"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/fenakhay/polyglossa"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
