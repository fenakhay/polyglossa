name: Catalog

on:
  schedule:
    - cron: '0 6 * * 4'
  workflow_dispatch:
    inputs:
      npm:
    name: Publish to npm
    needs: [fetch, tag]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ needs.fetch.outputs.version }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Build, test and publish the TypeScript package
        working-directory: typescript
        env:
          VERSION: ${{ needs.fetch.outputs.version }}
        run: |
          test "$(node -p 'require("./package.json").version')" = "$VERSION"
          npm ci --no-audit --no-fund
          npm test
          if npm view "polyglossa@$VERSION" version > /dev/null 2>&1; then
            echo "polyglossa@$VERSION is already on npm"
          else
            npm publish --provenance --access public
          fi

  crates-io:
    name: Publish to crates.io
    needs: [fetch, tag]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ needs.fetch.outputs.version }}

      - name: Test and publish the Rust crate
        working-directory: rust
        env:
          VERSION: ${{ needs.fetch.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          grep -qx "version = \"$VERSION\"" Cargo.toml
          cargo test --locked
          if cargo info "polyglossa@$VERSION" --registry crates-io > /dev/null 2>&1; then
            echo "polyglossa $VERSION is already on crates.io"
          else
            cargo publish --locked
          fi

  go-proxy:
    name: Make the Go module known to the Go proxy
    needs: [fetch, tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          cache: false

      - name: Ask the proxy for the new version
        env:
          VERSION: ${{ needs.fetch.outputs.version }}
        run: |
          GO_VERSION=$(printf 'v1.%04d%02d%02d.0' ${VERSION//./ })
          GOPROXY=https://proxy.golang.org go list -m "github.com/fenakhay/polyglossa/go@$GO_VERSION"

  release:
        description: Release even if Wiktionary's data has not changed, with what CHANGELOG.md has unreleased
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch Wiktionary's data
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.dump.outputs.changed }}
      release: ${{ steps.dump.outputs.release }}
      version: ${{ steps.dump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Fetch English Wiktionary's languages, families and scripts, failing if any export cannot be read
        id: dump
        env:
          RELEASE: ${{ inputs.release && '-Prelease' || '' }}
        run: ./gradlew catalogDump $RELEASE --stacktrace

      - name: Refuse a version that is already released
        if: steps.dump.outputs.release == 'true'
        env:
          VERSION: ${{ steps.dump.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "::error::$VERSION is already released; there is one release a day at most, named for the day of the export"
            exit 1
          fi

      - name: Keep the new data
        if: steps.dump.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: catalog
          path: |
            CHANGELOG.md
            data/catalog.tsv
            swift/Sources/Polyglossa/Resources/catalog.tsv
            python/src/polyglossa/catalog.tsv
            python/src/polyglossa/_version.py
            typescript/catalog.tsv
            typescript/package.json
            go/catalog.tsv
            rust/catalog.tsv
            rust/Cargo.toml
            spec/expectations.json
            tools/build/reports/catalog/notes.md
          if-no-files-found: error

  check:
    name: Check the new data
    needs: fetch
    if: needs.fetch.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      catalog: catalog

  tag:
    name: Commit and tag the release
    needs: [fetch, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: catalog

      - name: Commit the data and tag the release
        env:
          VERSION: ${{ needs.fetch.outputs.version }}
          CHANGED: ${{ needs.fetch.outputs.changed }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -E -i "s/(polyglossa:polyglossa:|from: \")[0-9]+\.[0-9]+\.[0-9]+/\1$VERSION/" README.md
          git add CHANGELOG.md README.md data/catalog.tsv swift/Sources/Polyglossa/Resources/catalog.tsv \
            python/src/polyglossa/catalog.tsv python/src/polyglossa/_version.py typescript/catalog.tsv \
            typescript/package.json go/catalog.tsv rust/catalog.tsv rust/Cargo.toml spec/expectations.json
          if [ "$CHANGED" = true ]; then
            git commit -m "feat(catalog): record English Wiktionary's data for $VERSION"
          else
            git commit -m "chore(release): release $VERSION"
          fi
          GO_TAG=$(printf 'go/v1.%04d%02d%02d.0' ${VERSION//./ })
          git tag "$VERSION"
          git tag "$GO_TAG"
          git push --atomic origin HEAD:main "refs/tags/$VERSION" "refs/tags/$GO_TAG"

  maven-central:
    name: Publish to Maven Central
    needs: [fetch, tag]
    runs-on: macos-26
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ needs.fetch.outputs.version }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Upload to the Central Portal
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew nmcpPublishAggregationToCentralPortal
          -PreleaseVersion=${{ needs.fetch.outputs.version }} --stacktrace

      - name: Say what is left to do by hand
        run: echo "The deployment waits on the Central Portal until it is published there by hand." >> "$GITHUB_STEP_SUMMARY"

  pypi:
    name: Publish to PyPI
    needs: [fetch, tag]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ needs.fetch.outputs.version }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'

      - name: Build the wheel and the source archive
        env:
          VERSION: ${{ needs.fetch.outputs.version }}
        run: |
          grep -qx "__version__ = \"$VERSION\"" python/src/polyglossa/_version.py
          python -m pip install --quiet build
          python -m build python

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: python/dist/

  release:
    name: Publish the GitHub release
    needs: [fetch, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ needs.fetch.outputs.version }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: catalog
          path: ${{ runner.temp }}/catalog

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Write the catalog as SQL
        run: ./gradlew sqlDump --stacktrace

      - name: Publish the release, with the catalog as TSV and as SQL
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.fetch.outputs.version }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/catalog/tools/build/reports/catalog/notes.md" \
            data/catalog.tsv tools/build/sql/polyglossa.sql

  docs:
    name: Publish the documentation of the release
    needs: [fetch, release]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rebuild the site from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
